server:
  port: 8080

spring:
  application:
    name: tailr
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 5MB # resume uploads, later
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health

tailr:
  ai:
    provider: ollama              # dev: ollama (free) | before deployment: claude
    ollama:
      base-url: http://localhost:11434
      model: qwen3:8b
      timeout-seconds: 180
    claude:                       # only used when provider: claude
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-haiku-5-5
      timeout-seconds: 30